name: solo64-stampdesk
services:
  bench:
    build:
      context: .
      args:
        STAMPDESK_DEPS_IMAGE: ${STAMPDESK_DEPS_IMAGE:-python:3.11-slim}
    image: ${STAMPDESK_IMAGE:-solo64-stampdesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${STAMPDESK_PORT:-19971}:8000"
    volumes:
      - surface-library:/var/lib/stampdesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  surface-library:
